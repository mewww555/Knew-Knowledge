# Edit the indented sentences. Keep the names on the left and the indentation.
intro: >-
  Knew Knowledge is an independent interdisciplinary project created by a Social Sciences student interested in consciousness, culture, virtual worlds, anthropology, sociology, psychology, and the ways humans determine what is real and meaningful.
paragraph_one: >-
  The project is a place for finished essays and unfinished questions. Some pieces begin with academic research; others begin with a game, an object, a ritual, a strange experience, or a question that refuses to go away.
paragraph_two: >-
  The goal is not to flatten different disciplines into one answer. It is to put them into conversation.

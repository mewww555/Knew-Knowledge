title: Knew Knowledge
description: Notes on consciousness, culture, virtual worlds, sacred things, and the strange ways humans decide what is real, meaningful, or true.
url: "https://mewww555.github.io"
baseurl: "/Knew-Knowledge"
permalink: /essays/:year/:month/:day/:title/
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
collections:
  notes:
    output: true
    permalink: /field-notes/:name/
  albums:
    output: true
    permalink: /albums/:name/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "notes"
    values:
      layout: post
  - scope:
      path: ""
      type: "albums"
    values:
      layout: album
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

---
layout: default
---
<article class="article-wrap">
  <header class="article-header">
    <p class="eyebrow">{{ page.category | default: page.categories | first | default: "Essay" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="dek">{{ page.subtitle }}</p>{% endif %}
    {% if page.date %}<p class="article-meta">{{ page.date | date: "%B %-d, %Y" }}</p>{% endif %}
  </header>
  <div class="ornament" aria-hidden="true">❦</div>
  <div class="prose">
    {{ content }}
  </div>
</article>
